		<style>

			@property --c {
				syntax: "<color>";
				inherits: true;
				initial-value: #3d6b35;
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				background: #000;
			}

			.loader {
				--rx: -38deg;
				--ry: 40deg;
				--rz: 0deg;
				width: 150px;
				height: 150px;
				border-radius: 50%;
				overflow: hidden;
				background: #0d1117;
				box-shadow: 0 0 18px rgba(33, 150, 243, 0.12),
					inset 0 0 12px rgba(0, 0, 0, 0.6);
				position: relative;
				display: flex;
				align-items: center;
				justify-content: center;
				perspective: 240px;
				contain: layout style;
			}

			.loader::after {
				content: "";
				position: absolute;
				inset: 0;
				border-radius: 50%;
				border: 1px solid rgba(255, 255, 255, 0.08);
				pointer-events: none;
				z-index: 10;
			}

			.bars {
				position: relative;
				width: 2px;
				height: 100%;
				transform-style: preserve-3d;
				transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz));
			}

			.bar {
				position: absolute;
				bottom: 39px;
				left: -3px;
				width: 6px;
				transform-origin: bottom center;
				transform-style: preserve-3d;
				will-change: transform;
				contain: layout style;
				
			}

			/* Fixed heights per ring */
			.bar-ext {
				height: 72px;
			}
			.bar-sec {
				height: 65px;
			}
			.bar-outer {
				height: 59px;
			}
			.bar-mid {
				height: 38px;
			}
			.bar-inner {
				height: 23px;
			}
			.bar-core {
				height: 14px;
			}

			/* Each face of the cube */
			.face {
				position: absolute;
				width: 6px;
				height: 100%;
				left: 50%;
				margin-left: -3px;
				backface-visibility: hidden;
				background: var(--c);
			}

			.face-front {
				transform: rotateY(0deg) translateZ(3px);
				filter: brightness(1);
			}
			.face-left {
				transform: rotateY(270deg) translateZ(3px);
				filter: brightness(0.7);
			}

			/* Cap on top of each bar */
			.bar::after {
				content: "";
				position: absolute;
				top: 0;
				left: 50%;
				width: 6px;
				height: 6px;
				margin-left: -3px;
				transform: rotateX(90deg) translateZ(0px) translateY(-3px);
				transform-origin: center top;
				background: var(--c);
				filter: brightness(1.1);
			}
