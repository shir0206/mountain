<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shir Zabolotny · Frontend Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ═══════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════ */
      :root {
        --bg: #f9f6f1;
        --bg-soft: #f2ede4;
        --bg-warm: #eae3d8;
        --ink: #2b2925;
        --ink-mid: #5a5550;
        --ink-light: #9a918a;
        --caramel: #9a7b56;
        --caramel-lt: #c9a97d;
        --sage: #6b8c6d;
        --sand: #d4c5b0;
        --line: #ddd7ce;
        --dark-bg: #1c1a18;
        --dark-soft: #252320;
        --dark-line: rgba(255, 255, 255, 0.08);

        --ff-display: "Cormorant Garamond", serif;
        --ff-body: "Jost", sans-serif;

        --radius-s: 6px;
        --radius-m: 14px;
        --radius-pill: 999px;
      }

      /* ═══════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
      }
      body {
        font-family: var(--ff-body);
        font-weight: 300;
        font-size: 16px;
        background: var(--bg);
        color: var(--ink);
        overflow-x: hidden;
      }
      [dir="rtl"] {
        font-family: var(--ff-body);
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      ul {
        list-style: none;
      }
      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ═══════════════════════════════════════════════
   GRAIN OVERLAY
═══════════════════════════════════════════════ */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
        background-size: 160px;
        pointer-events: none;
        z-index: 9000;
        opacity: 0.45;
      }

      /* ═══════════════════════════════════════════════
   TYPOGRAPHY HELPERS
═══════════════════════════════════════════════ */
      .section-label {
        font-size: 0.68rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--caramel);
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }
      .section-label::before {
        content: "";
        width: 22px;
        height: 1px;
        background: var(--caramel-lt);
        flex-shrink: 0;
      }
      [dir="rtl"] .section-label::before {
        display: none;
      }
      [dir="rtl"] .section-label::after {
        content: "";
        width: 22px;
        height: 1px;
        background: var(--caramel-lt);
        flex-shrink: 0;
      }

      .section-title {
        font-family: var(--ff-display);
        font-size: clamp(1rem, 4vw, 2rem);
        font-weight: 400;
        line-height: 1.13;
        color: var(--ink);
        margin-bottom: 28px;
      }
      .section-title em {
        font-size: clamp(2rem, 6vw, 3.6rem);

        font-style: italic;
        color: var(--caramel);
      }

      /* BUTTONS */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 13px 28px;
        background: var(--ink);
        color: var(--bg);
        border-radius: var(--radius-pill);
        font-family: var(--ff-body);
        font-size: 0.78rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        border: none;
        cursor: pointer;
        transition: background 0.25s, transform 0.2s;
      }
      .btn-primary:hover {
        background: var(--caramel);
        transform: translateY(-2px);
      }

      .btn-ghost {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 13px 28px;
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: var(--radius-pill);
        font-family: var(--ff-body);
        font-size: 0.78rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        background: none;
        cursor: pointer;
        transition: border-color 0.25s, color 0.25s, transform 0.2s;
      }
      .btn-ghost:hover {
        border-color: var(--caramel);
        color: var(--caramel);
        transform: translateY(-2px);
      }

      /* ═══════════════════════════════════════════════
   NAV  — mobile first
═══════════════════════════════════════════════ */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 800;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: rgba(249, 246, 241, 0.9);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid transparent;
        transition: border-color 0.3s;
      }
      nav.scrolled {
        border-color: var(--line);
      }

      .nav-logo {
        font-family: var(--ff-display);
        font-size: 1.1rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--ink);
        flex-shrink: 0;
      }
      .nav-logo em {
        font-style: italic;
        color: var(--caramel);
      }

      .nav-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Language toggle */
      .lang-toggle {
        display: flex;
        align-items: center;
        background: var(--bg-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius-pill);
        overflow: hidden;
        height: 34px;
      }
      .lang-btn {
        padding: 0 12px;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        font-weight: 400;
        color: var(--ink-light);
        background: none;
        border: none;
        cursor: pointer;
        height: 100%;
        transition: background 0.2s, color 0.2s;
      }
      .lang-btn.active {
        background: var(--caramel);
        color: white;
      }

      .nav-links {
        display: none;
      }

      .nav-cta-btn {
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 9px 18px;
        border: 1px solid var(--caramel);
        border-radius: var(--radius-pill);
        color: var(--caramel);
        background: none;
        cursor: pointer;
        transition: background 0.25s, color 0.25s;
        white-space: nowrap;
      }
      .nav-cta-btn:hover {
        background: var(--caramel);
        color: var(--bg);
      }

      /* hamburger for mobile */
      .hamburger {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        width: 28px;
      }
      .hamburger span {
        display: block;
        height: 1.5px;
        background: var(--ink);
        border-radius: 2px;
        transition: transform 0.3s, opacity 0.3s, width 0.3s;
      }
      .hamburger span:last-child {
        width: 70%;
      }
      .hamburger.open span:first-child {
        transform: translateY(6.5px) rotate(45deg);
      }
      .hamburger.open span:nth-child(2) {
        opacity: 0;
      }
      .hamburger.open span:last-child {
        width: 100%;
        transform: translateY(-6.5px) rotate(-45deg);
      }

      /* mobile menu */
      .mobile-menu {
        display: none;
        position: fixed;
        top: 64px;
        left: 0;
        right: 0;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        z-index: 799;
        flex-direction: column;
        padding: 24px 20px 32px;
        gap: 24px;
      }
      .mobile-menu.open {
        display: flex;
      }
      .mobile-menu a {
        font-size: 1.1rem;
        color: var(--ink-mid);
        letter-spacing: 0.05em;
      }

      /* TABLET+ */
      @media (min-width: 768px) {
        nav {
          padding: 0 40px;
          height: 70px;
        }
        .hamburger {
          display: none;
        }
        .mobile-menu {
          display: none !important;
        }
        .nav-links {
          display: flex;
          gap: 32px;
          align-items: center;
        }
        .nav-links a {
          font-size: 0.74rem;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: var(--ink-mid);
          position: relative;
          padding-bottom: 2px;
          transition: color 0.2s;
        }
        .nav-links a::after {
          content: "";
          position: absolute;
          bottom: 0;
          left: 0;
          width: 0;
          height: 1px;
          background: var(--caramel);
          transition: width 0.3s;
        }
        .nav-links a:hover {
          color: var(--ink);
        }
        .nav-links a:hover::after {
          width: 100%;
        }
        [dir="rtl"] .nav-links a::after {
          left: auto;
          right: 0;
        }
      }

      @media (min-width: 1024px) {
        nav {
          padding: 0 60px;
        }
      }

      /* ═══════════════════════════════════════════════
   SECTION WRAPPER
═══════════════════════════════════════════════ */
      .section-wrap {
        padding: 80px 20px;
      }
      @media (min-width: 768px) {
        .section-wrap {
          padding: 100px 40px;
        }
      }
      @media (min-width: 1024px) {
        .section-wrap {
          padding: 120px 60px;
        }
      }

      .container {
        max-width: 1140px;
        margin: 0 auto;
      }

      /* ═══════════════════════════════════════════════
   HERO
═══════════════════════════════════════════════ */
      #home {
        padding-top: calc(64px + 64px);
        padding-bottom: 80px;
        padding-left: 20px;
        padding-right: 20px;
        min-height: 90vh;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
      }
      @media (min-width: 768px) {
        #home {
          padding-top: calc(70px + 80px);
          padding-left: 40px;
          padding-right: 40px;
        }
      }
      @media (min-width: 1024px) {
        #home {
          padding-left: 60px;
          padding-right: 60px;
          min-height: 100vh;
        }
      }

      .hero-inner {
        max-width: 1140px;
        margin: 0 auto;
        width: 100%;
      }

      .hero-name {
        font-size: 1rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--caramel);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0;
        animation: fadeUp 0.7s 0.1s forwards;
      }
      .hero-name::before {
        content: "";
        width: 22px;
        height: 1px;
        background: var(--caramel-lt);
      }

      .hero-title {
        font-family: var(--ff-display);
        font-size: clamp(3rem, 10vw, 6.5rem);
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -0.01em;
        margin-bottom: 28px;
        opacity: 0;
        animation: fadeUp 0.8s 0.25s forwards;
      }
      .hero-title em {
        font-style: italic;
        color: var(--caramel);
      }

      .hero-sub {
        font-size: clamp(1rem, 2.5vw, 1.15rem);
        line-height: 1.78;
        color: var(--ink-mid);
        max-width: 580px;
        margin-bottom: 40px;
        opacity: 0;
        animation: fadeUp 0.8s 0.4s forwards;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        opacity: 0;
        animation: fadeUp 0.8s 0.55s forwards;
      }

      /* hero decorative circle */
      #home::before {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        border: 1px solid var(--sand);
        right: -100px;
        bottom: -80px;
        pointer-events: none;
        opacity: 0.6;
      }
      @media (min-width: 1024px) {
        #home::before {
          width: 560px;
          height: 560px;
          right: -60px;
          bottom: auto;
          top: 50%;
          transform: translateY(-50%);
        }
      }

      /* ═══════════════════════════════════════════════
   ABOUT
═══════════════════════════════════════════════ */
      #about {
        background: var(--bg-soft);
      }

      .about-grid {
        display: flex;
        flex-direction: column;
        gap: 48px;
      }

      .about-photo-wrap {
        width: 100%;
        max-width: 340px;
        margin: 0 auto;
        position: relative;
      }
      .about-photo {
        width: 100%;
        aspect-ratio: 3/4;
        border-radius: var(--radius-m);
        overflow: hidden;
        background: var(--bg-warm);
        border: 1px solid var(--line);
        position: relative;
      }
      .about-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .about-photo-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--ink-light);
      }
      .about-photo-placeholder svg {
        width: 40px;
        height: 40px;
        stroke: var(--sand);
      }
      .about-photo-placeholder span {
        font-size: 0.75rem;
        letter-spacing: 0.1em;
      }
      /* When real image is loaded, hide placeholder */
      .about-photo img:not([src=""]) + .about-photo-placeholder {
        display: none;
      }

      .about-body p {
        font-size: 1rem;
        line-height: 1.85;
        color: var(--ink-mid);
        margin-bottom: 16px;
      }
      .about-body p:last-child {
        margin-bottom: 0;
      }
      .about-body strong {
        font-weight: 400;
        color: var(--caramel);
      }

      @media (min-width: 768px) {
        .about-grid {
          flex-direction: row;
          align-items: flex-start;
          gap: 60px;
        }
        .about-photo-wrap {
          flex-shrink: 0;
          width: 260px;
          margin: 0;
        }
      }
      @media (min-width: 1024px) {
        .about-photo-wrap {
          width: 320px;
        }
        .about-grid {
          gap: 100px;
        }
      }

      /* ═══════════════════════════════════════════════
   TOGETHER SECTION
═══════════════════════════════════════════════ */
      #together {
        background: var(--bg);
      }

      /* cards sub-section */
      .together-cards-label {
        margin-bottom: 18px;
      }
      .cards-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 60px;
      }
      @media (min-width: 560px) {
        .cards-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (min-width: 1024px) {
        .cards-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .service-card {
        border: 1px solid var(--line);
        border-radius: var(--radius-m);
        padding: 28px 24px;
        background: var(--bg);
        position: relative;
        overflow: hidden;
        transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
        cursor: default;
      }
      .service-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--bg-soft), var(--bg-warm));
        opacity: 0;
        transition: opacity 0.3s;
      }
      .service-card:hover {
        border-color: var(--caramel-lt);
        transform: translateY(-3px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07);
      }
      .service-card:hover::before {
        opacity: 1;
      }
      .service-card-inner {
        position: relative;
        z-index: 1;
      }
      .service-num {
        font-family: var(--ff-display);
        font-size: 2.8rem;
        font-weight: 300;
        color: var(--line);
        line-height: 1;
        margin-bottom: 18px;
        transition: color 0.3s;
      }
      .service-card:hover .service-num {
        color: var(--caramel-lt);
      }
      .service-name {
        font-family: var(--ff-display);
        font-size: 1.25rem;
        font-weight: 500;
        margin-bottom: 10px;
        color: var(--ink);
      }
      .service-desc {
        font-size: 0.87rem;
        line-height: 1.75;
        color: var(--ink-mid);
      }

      /* process sub-section */
      .process-intro {
        max-width: 560px;
        font-size: 0.95rem;
        line-height: 1.75;
        color: var(--ink-mid);
        margin-bottom: 48px;
      }

      /* MOBILE: vertical stack */
      .process-list {
        display: flex;
        flex-direction: column;
        gap: 0;
        position: relative;
      }
      .process-list::before {
        content: "";
        position: absolute;
        left: 19px;
        top: 4%;
        bottom: 20px;
        width: 1px;
        background: var(--line);
      }
      [dir="rtl"] .process-list::before {
        left: auto;
        right: 19px;
      }

      .process-item {
        display: flex;
        gap: 20px;
        padding-bottom: 36px;
        position: relative;
      }
      .process-item:last-child {
        padding-bottom: 0;
      }

      .process-dot-wrap {
        flex-shrink: 0;
        width: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .process-dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--line);
        background: var(--bg);
        position: relative;
        z-index: 1;
        transition: border-color 0.3s, background 0.3s;
        flex-shrink: 0;
      }
      .process-item:hover .process-dot {
        border-color: var(--caramel);
        background: var(--caramel);
      }
      .process-content {
        padding-top: 0;
      }
      .process-num {
        margin-bottom: 8px;
        line-height: 1;
      }
      .process-num svg {
        width: 22px;
        height: 22px;
        stroke: var(--caramel);
      }
      .process-name {
        font-family: var(--ff-display);
        font-size: 1.3rem;
        font-weight: 500;
        margin-bottom: 8px;
        color: var(--ink);
      }
      .process-desc {
        font-size: 0.88rem;
        line-height: 1.75;
        color: var(--ink-mid);
      }

      /* DESKTOP: horizontal timeline */
      @media (min-width: 900px) {
        .process-list {
          flex-direction: row;
          align-items: flex-start;
          gap: 0;
        }
        .process-list::before {
          left: 10%;
          right: 10%;
          top: 4%;
          bottom: auto;
          width: auto;
          height: 1px;
        }
        [dir="rtl"] .process-list::before {
          left: 10%;
          right: 10%;
        }
        .process-item {
          flex: 1;
          flex-direction: column;
          padding-bottom: 0;
          padding-top: 0;
          padding-left: 12px;
          padding-right: 12px;
        }
        .process-dot-wrap {
          width: auto;
          margin-bottom: 20px;
        }
        .process-dot {
          margin: 0 auto;
        }
        .process-content {
          text-align: center;
        }
      }

      /* ═══════════════════════════════════════════════
   AI SECTION — DARK
═══════════════════════════════════════════════ */
      #ai {
        background: var(--dark-bg);
        color: #ede8e0;
        padding: 80px 20px;
      }
      @media (min-width: 768px) {
        #ai {
          padding: 100px 40px;
        }
      }
      @media (min-width: 1024px) {
        #ai {
          padding: 120px 60px;
        }
      }

      #ai .section-label {
        color: var(--caramel-lt);
      }
      #ai .section-label::before {
        background: var(--caramel);
      }
      #ai .section-title {
        color: #ede8e0;
      }

      .ai-intro {
        max-width: 680px;
        margin-bottom: 60px;
      }
      .ai-intro-text {
        font-family: var(--ff-display);
        font-size: clamp(1.2rem, 3vw, 1.65rem);
        font-weight: 300;
        line-height: 1.65;
        color: #d4c5b0;
        margin-bottom: 20px;
      }
      .ai-intro-sub {
        font-size: 0.95rem;
        line-height: 1.8;
        color: rgba(237, 232, 224, 0.6);
      }

      .ai-pillars {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }
      @media (min-width: 768px) {
        .ai-pillars {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (min-width: 1024px) {
        .ai-pillars {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .ai-pillar {
        background: var(--dark-soft);
        border: 1px solid var(--dark-line);
        border-radius: var(--radius-m);
        padding: 32px 28px;
        transition: border-color 0.3s;
      }
      .ai-pillar:hover {
        border-color: rgba(154, 123, 86, 0.4);
      }
      .ai-pillar-icon {
        width: 40px;
        height: 40px;
        background: rgba(154, 123, 86, 0.12);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .ai-pillar-icon svg {
        width: 18px;
        height: 18px;
        stroke: var(--caramel-lt);
      }
      .ai-pillar-title {
        font-family: var(--ff-display);
        font-size: 1.25rem;
        font-weight: 500;

      /* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
      let currentLang = "en";

      /* ═══════════════════════════════════════════
   ICONS
═══════════════════════════════════════════ */
      const ICONS = {
        check: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
        eye: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
        refresh: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
        link: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
        zap: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
        target: `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,
        search: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>`,
        lightbulb: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>`,
        hammer: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="16 18 22 18 22 12"/><polyline points="8 6 2 6 2 12"/><path d="m7 15 4-4"/><path d="m17 9-4 4"/><path d="m3 3 18 18"/></svg>`,
        code: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>`,
        sparkles: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>`,
        loop: `<svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
      };

      /* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
      function render() {
        const d = CONTENT[currentLang];
        const dir = currentLang === "he" ? "rtl" : "ltr";
        document.documentElement.setAttribute("lang", currentLang);
        document.documentElement.setAttribute("dir", dir);

        /* NAV */
        document.getElementById("nav-logo").innerHTML = d.nav.logo;
        document.getElementById("nav-links").innerHTML = d.nav.links
          .map((l) => `<li><a href="${l.href}">${l.label}</a></li>`)
          .join("");
        document.getElementById("nav-cta").textContent = d.nav.cta;

        /* mobile menu */
        document.getElementById("mobile-menu").innerHTML = d.nav.links
          .map(
            (l) =>
              `<a href="${l.href}" onclick="closeMobileMenu()">${l.label}</a>`
          )
          .join("");

        /* HERO */
        document.getElementById("hero-name").textContent = d.hero.name;
        document.getElementById(
          "hero-title"
        ).innerHTML = `${d.hero.titleLine}<br><em>${d.hero.titleEmphasis}</em>`;
        document.getElementById("hero-sub").textContent = d.hero.sub;
        document.getElementById("hero-actions").innerHTML = d.hero.actions
          .map(
            (a) => `<a class="btn-${a.style}" href="${a.href}">${a.label}</a>`
          )
          .join("");

        /* ABOUT */
        document.getElementById("about-label").textContent = d.about.label;
        document.getElementById("about-title").innerHTML =
          d.about.title.replace(/\n/g, "<br>");
        document.getElementById("about-paragraphs").innerHTML =
          d.about.paragraphs
            .map((p, i) => `<p class="reveal reveal-d${i + 2}">${p}</p>`)
            .join("");
        document.getElementById("about-photo-hint").textContent =
          d.about.photoHint;

        /* TOGETHER */
        document.getElementById("together-label").textContent =
          d.together.label;
        document.getElementById("together-title").innerHTML =
          d.together.title.replace(/\n/g, "<br>");
        document.getElementById("cards-label").textContent =
          d.together.cardsLabel;

        document.getElementById("cards-grid").innerHTML = d.together.cards
          .map(
            (c, i) => `
    <div class="service-card reveal reveal-d${i % 3}">
      <div class="service-card-inner">
        <div class="service-num">${c.num}</div>
        <div class="service-name">${c.name}</div>
        <p class="service-desc">${c.desc}</p>
      </div>
    </div>`
          )
          .join("");

        document.getElementById("process-label").textContent =
          d.together.processLabel;
        document.getElementById("process-title").textContent =
          d.together.processTitle;
        document.getElementById("process-intro").textContent =
          d.together.processIntro;
        document.getElementById("process-list").innerHTML = d.together.steps
          .map(
            (s) => `
    <div class="process-item reveal">
      <div class="process-dot-wrap"><div class="process-dot"></div></div>
      <div class="process-content">
        <div class="process-num">${ICONS[s.icon]}</div>
        <div class="process-name">${s.name}</div>
        <p class="process-desc">${s.desc}</p>
      </div>
    </div>`
          )
          .join("");

        /* AI */
        document.getElementById("ai-label").textContent = d.ai.label;
        document.getElementById("ai-title").innerHTML = d.ai.title.replace(
          /\n/g,
          "<br>"
        );
        document.getElementById("ai-intro-text").textContent = d.ai.introText;
        document.getElementById("ai-intro-sub").textContent = d.ai.introSub;

        document.getElementById("ai-pillars").innerHTML = d.ai.pillars
          .map(
            (p) => `
    <div class="ai-pillar reveal">
      <div class="ai-pillar-icon">${ICONS[p.icon]}</div>
      ${p.sub ? `<div class="ai-pillar-sub">${p.sub}</div>` : ""}
      <div class="ai-pillar-title">${p.title}</div>
      <p class="ai-pillar-text">${p.text}</p>
      <hr class="ai-pillar-hr" />
      <ul class="ai-pillar-items">
        ${p.items.map((i) => `<li class="ai-pillar-item">${i}</li>`).join("")}
      </ul>
      ${p.value ? `<p class="ai-pillar-value">${p.value}</p>` : ""}
    </div>`
          )
          .join("");

        document.getElementById("ai-footer-text").innerHTML = d.ai.footerText;

        /* CONTACT */
        document.getElementById("contact-title").innerHTML =
          d.contact.title.replace(/\n/g, "<br>");
        document.getElementById("contact-sub").textContent = d.contact.sub;
        const em = document.getElementById("contact-email");
        em.href = `mailto:${d.contact.email}`;
        document.getElementById("contact-email-text").textContent =
          d.contact.email;

        document.getElementById("form-name-label").textContent =
          d.contact.form.nameLabel;
        document.getElementById("form-name").placeholder =
          d.contact.form.namePlaceholder;
        document.getElementById("form-email-label").textContent =
          d.contact.form.emailLabel;
        document.getElementById("form-email").placeholder =
          d.contact.form.emailPlaceholder;
        document.getElementById("form-message-label").textContent =
          d.contact.form.messageLabel;
        document.getElementById("form-message").placeholder =
          d.contact.form.messagePlaceholder;
        document.getElementById("form-submit-btn").textContent =
          d.contact.form.submit;

        /* FOOTER */
        document.getElementById("footer-name").innerHTML = d.footer.name;
        document.getElementById("footer-copy").textContent =
          d.footer.copy.replace("{year}", new Date().getFullYear());

        /* reattach scroll observers after render */
        attachObservers();
      }

      /* ═══════════════════════════════════════════
   LANGUAGE TOGGLE
═══════════════════════════════════════════ */
      function setLang(lang) {
        currentLang = lang;
        document
          .getElementById("btn-en")
          .classList.toggle("active", lang === "en");
        document
          .getElementById("btn-he")
          .classList.toggle("active", lang === "he");
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      /* ═══════════════════════════════════════════
   HAMBURGER
═══════════════════════════════════════════ */
      const hamburger = document.getElementById("hamburger");
      const mobileMenu = document.getElementById("mobile-menu");

      hamburger.addEventListener("click", () => {
        hamburger.classList.toggle("open");
        mobileMenu.classList.toggle("open");
      });

      function closeMobileMenu() {
        hamburger.classList.remove("open");
        mobileMenu.classList.remove("open");
      }

      /* ═══════════════════════════════════════════
   NAV SCROLL
═══════════════════════════════════════════ */
      window.addEventListener("scroll", () => {
        document
          .getElementById("main-nav")
          .classList.toggle("scrolled", window.scrollY > 10);
      });

      /* ═══════════════════════════════════════════
   SCROLL REVEAL
═══════════════════════════════════════════ */
      let observer;
      function attachObservers() {
        if (observer) observer.disconnect();
        observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("visible");
                observer.unobserve(e.target);
              }
            });
          },
          { threshold: 0.1 }
        );
        document.querySelectorAll(".reveal").forEach((el) => {
          el.classList.remove("visible");
          observer.observe(el);
        });
      }

      /* ═══════════════════════════════════════════
   FORM
═══════════════════════════════════════════ */
      document
        .getElementById("contact-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const btn = document.getElementById("form-submit-btn");
          const status = document.getElementById("form-status");
          btn.textContent = "...";
          btn.disabled = true;
          setTimeout(() => {
            btn.textContent = CONTENT[currentLang].contact.form.submit;
            btn.disabled = false;
            status.textContent = CONTENT[currentLang].contact.form.successMsg;
            status.classList.add("visible");
            this.reset();
            setTimeout(() => status.classList.remove("visible"), 4000);
          }, 1000);
        });

      /* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
      render();
    </script>
